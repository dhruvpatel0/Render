<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eceeed;--surface:#f8f9f8;--ink:#16191a;--muted:#5b6264;--line:#cfd4d3;--accent:#d4471a;--soft:rgba(212,71,26,.12);--green:#2f6f5e;
--display:"Archivo","Helvetica Neue",Arial,sans-serif;--body:"Public Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#131617;--surface:#1b1f20;--ink:#e7eaea;--muted:#9aa3a5;--line:#2e3436;--accent:#ff6a3d;--soft:rgba(255,106,61,.16);--green:#6cc1a5;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{font-family:var(--display);font-stretch:85%;font-weight:750;font-size:1.2rem}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{font-family:var(--mono);font-size:.74rem;color:var(--muted);padding:4px 10px;border-radius:4px}
.step.on{color:var(--ink);background:var(--soft)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:16px;min-width:0;min-height:0}
.frame{position:relative;max-width:100%;max-height:100%;line-height:0}
.frame img{max-width:100%;max-height:calc(100vh - 110px);display:block;border-radius:4px}
#render{cursor:crosshair}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.busy{position:absolute;left:12px;top:12px;background:var(--ink);color:var(--bg);font:500 .82rem var(--mono);padding:6px 10px;border-radius:4px;line-height:1.4}
.toast{position:absolute;left:12px;bottom:12px;background:var(--ink);color:var(--bg);font-size:.85rem;padding:8px 12px;border-radius:4px;line-height:1.4;max-width:80%}
aside{border-left:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.group{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.chip{font-family:var(--mono);font-size:.76rem;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem}
.toggle{width:40px;height:22px;border-radius:11px;border:1px solid var(--line);background:var(--bg);position:relative;padding:0;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle[aria-pressed=true]{background:var(--accent)}.toggle[aria-pressed=true]::after{left:20px;background:#fff}
.sel{font-family:var(--display);font-stretch:90%;font-weight:700;font-size:1.1rem}
.hint{font-size:.85rem;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 8px 4px 4px;font-size:.82rem}
.sw i{width:18px;height:18px;border-radius:3px;display:block;border:1px solid rgba(0,0,0,.15)}
.sw[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;font:inherit;font-size:.88rem;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.primary{border:0;background:var(--ink);color:var(--bg);border-radius:4px;padding:8px 14px;font-weight:600}
.plan{font-size:.85rem;background:var(--bg);border-left:3px solid var(--green);padding:8px 10px}
.layers{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:.78rem}
.layers label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;background:var(--bg)}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:.82rem;text-decoration:underline}
.lib{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.lib input{font:inherit;font-size:.86rem;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.mats{display:flex;flex-direction:column;gap:2px}
.mat{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:4px;font-size:.82rem}
.mat:hover,.mat[aria-pressed=true]{background:var(--bg)}
.mat i{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.mat span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat small{font-family:var(--mono);color:var(--muted);font-size:.7rem}
.tag{font-family:var(--mono);font-size:.68rem;color:var(--green)}
.trust{font-size:.8rem;color:var(--green);font-family:var(--mono)}
/* start screen */
.start{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:24px}
.drop{max-width:560px;width:100%;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);padding:40px 24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop h1{font-family:var(--display);font-stretch:85%;font-size:2rem;line-height:1.1;margin:0}
.drop p{margin:0;color:var(--muted);max-width:44ch}
.or{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{border:1px solid var(--line);background:transparent;border-radius:4px;padding:8px 14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}.frame img{max-height:none}}
</style>
</head>
<body>
<header>
  <span class="brand">Render Studio</span>
  <nav class="steps" aria-label="Flow">
    <span class="step" data-s="drop">1 Drop</span><span class="step" data-s="frame">2 Frame</span>
    <span class="step" data-s="moment">3 Moment</span><span class="step" data-s="render">4 Render</span><span class="step" data-s="refine">5 Refine</span>
  </nav>
</header>
<main id="main">
  <section class="start" id="start">
    <div class="drop" id="drop">
      <h1>Drop in your model</h1>
      <p>Export your SketchUp scene as FBX (SketchUp Pro) or glTF/GLB, and drop it here. We render it with real light, then you can change any object without anything else moving.</p>
      <div class="or">
        <label class="primary" for="file" style="cursor:pointer">Choose a file</label>
        <input type="file" id="file" accept=".fbx,.glb,.gltf" hidden>
        <button class="ghost" id="sample" type="button">Try the sample room</button>
      </div>
      <p class="hint" id="startMsg"></p>
    </div>
  </section>
</main>
<template id="studioTpl">
  <section class="stage">
    <div class="frame" id="frame">
      <img id="render" alt="Rendered view, tap an object to select it">
      <img id="overlay" alt="">
    </div>
    <div class="busy" id="busy" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </section>
  <aside>
    <div class="group"><span class="eyebrow">Moment</span><div class="seg" id="moments"></div></div>
    <div class="group"><span class="eyebrow">Light studio</span>
      <div class="row">Pendant and room lights <button class="toggle" id="tPendant" aria-label="Pendant light"></button></div>
      <div class="row">LED cove <button class="toggle" id="tCove" aria-label="LED cove"></button></div>
      <div class="seg" id="kelvins"></div>
    </div>
    <div class="group"><span class="eyebrow">AI finish</span>
      <div class="row">Photoreal finish <button class="toggle" id="tAI" aria-label="AI finish"></button></div>
      <div class="hint" id="aiHint"></div>
    </div>
    <div class="group"><span class="eyebrow">Selection</span>
      <div class="sel" id="selName">Nothing selected</div>
      <div class="hint" id="selHint">Tap an object in the picture.</div>
      <div class="swatches" id="swatches"></div>
      <div class="row" id="lockRow" hidden>Lock this material <button class="toggle" id="tLock" aria-label="Lock selected material"></button></div>
      <div class="lib" id="lib" hidden>
        <span class="eyebrow">Library</span>
        <input id="libQ" placeholder="Search: oak, marble, velvet…" autocomplete="off" aria-label="Search the material library">
        <div class="seg" id="libCats"></div>
        <div class="swatches" id="libItems"></div>
      </div>
    </div>
    <div class="group" id="matGroup" hidden><span class="eyebrow">Materials in your model</span>
      <div class="hint">Matched from the SketchUp names and colours. Tap one to change it.</div>
      <div class="mats" id="mats"></div>
    </div>
    <div class="group"><span class="eyebrow">Describe a change</span>
      <form class="ask" id="ask"><input id="askText" placeholder="night, sofa forest green" autocomplete="off" aria-label="Describe a change"><button class="primary" type="submit">Apply</button></form>
      <div class="plan" id="plan" hidden></div>
    </div>
    <div class="group"><div class="row"><span class="eyebrow">Edit layers</span><button class="link" id="reset" type="button">Reset</button></div>
      <div class="layers" id="layers"></div>
      <div class="trust" id="trust"></div>
    </div>
  </aside>
</template>
<script>
(() => {
const $ = id => document.getElementById(id);
let cat = null, P = null, sel = null, poll = null, toastT = null, libCat = null, libT = null;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = r.headers.get('content-type')?.includes('json') ? await r.json() : null;
  if (!r.ok) throw new Error(body?.detail || `Request failed (${r.status})`);
  return body;
}
const json = (method, body) => ({method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
function steps(on) { document.querySelectorAll('.step').forEach(s => s.classList.toggle('on', on.includes(s.dataset.s))); }
function toast(t) { const el = $('toast'); if (!el) return; el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3500); }

// ---- start ----
steps(['drop']);
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) start(f); });
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) start(f); });
$('sample').addEventListener('click', () => start(null));

async function start(file) {
  $('startMsg').textContent = file ? `Uploading ${file.name}…` : 'Setting up the sample room…';
  try {
    cat = cat || await api('/api/catalog');
    const fd = new FormData(); if (file) fd.append('model', file);
    P = await api('/api/projects', {method: 'POST', body: fd});
  } catch (err) { $('startMsg').textContent = err.message; return; }
  $('main').innerHTML = ''; $('main').appendChild($('studioTpl').content.cloneNode(true));
  wire(); show(P); watch();
}

// ---- studio ----
function wire() {
  $('render').addEventListener('click', async e => {
    if (P.status === 'rendering' && !P.version) return;
    const r = e.target.getBoundingClientRect();
    try { sel = await api(`/api/projects/${P.id}/pick?x=${(e.clientX - r.left) / r.width}&y=${(e.clientY - r.top) / r.height}`); }
    catch (err) { toast(err.message); return; }
    select(sel);
  });
  $('libQ').addEventListener('input', () => { clearTimeout(libT); libT = setTimeout(browse, 200); });
  $('tPendant').onclick = () => layer('lights', `Lights: ${P.state.pendant ? 'off' : 'on'}`, {pendant: !P.state.pendant});
  $('tCove').onclick = () => layer('cove', `LED cove: ${P.state.cove ? 'off' : 'on'}`, {cove: !P.state.cove});
  $('tAI').onclick = () => { if (!P.ai.available) return toast('AI finish is not set up on this server yet.'); layer('ai', `AI finish: ${P.ai.on ? 'off' : 'on'}`, {ai_finish: !P.ai.on}); };
  $('tLock').onclick = async () => { const k = lockKey(); P = await api(`/api/projects/${P.id}/locks`, json('POST', {object: k, locked: !P.locks.includes(k)})); await refreshSel(); show(P); };
  $('reset').onclick = async () => { sel = null; $('overlay').hidden = true; P = await api(`/api/projects/${P.id}/reset`, {method: 'POST'}); show(P); watch(); };
  $('ask').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('askText').value.trim() || 'night, sofa forest green';
    const r = await api(`/api/projects/${P.id}/intent`, json('POST', {text}));
    const plan = $('plan'); plan.hidden = false;
    plan.textContent = !r.understood ? 'I could not map that yet. Try "dusk", "lights warm", "sofa terracotta" or "travertine floor".'
      : `Plan: ${r.applied.join(' · ') || 'nothing applied'}.${r.skipped_locked.length ? ` Skipped (locked): ${r.skipped_locked.join(', ')}.` : ''} Everything else stays as it is.`;
    P = r.project; show(P); watch();
  });
}
async function layer(key, label, set) {
  try { P = await api(`/api/projects/${P.id}/layers`, json('POST', {key, label, set})); await refreshSel(); show(P); watch(); }
  catch (err) { toast(err.message); }
}
const lockKey = () => sel.material ? sel.material.key : sel.object;
const maskUrl = () => sel.material ? `/api/projects/${P.id}/mask.png?material=${encodeURIComponent(sel.material.slot)}&v=${P.version}`
  : `/api/projects/${P.id}/mask.png?object=${sel.object}&v=${P.version}`;
function select(s) {
  sel = s; $('overlay').src = maskUrl(); $('overlay').hidden = false; steps(['refine']); panel(); if (sel.material) browse();
}
async function refreshSel() {
  if (sel && sel.material) { const r = await api(`/api/projects/${P.id}/material?slot=${encodeURIComponent(sel.material.slot)}`); sel = {...sel, material: r.material}; }
}
function swatch(name, color, pressed, onclick, note) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'sw';
  const i = document.createElement('i'); i.style.background = color; b.append(i, document.createTextNode(name));
  if (note) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = note; b.append(t); }
  b.setAttribute('aria-pressed', pressed); b.onclick = onclick; return b;
}
function useMaterial(value, name) {
  const m = sel.material; layer(m.key, `${m.slot}: ${name}`, {[m.key]: value});
}
async function browse() {
  if (!sel || !sel.material) return;
  let r; try { r = await api(`/api/library?q=${encodeURIComponent($('libQ').value)}${libCat ? `&category=${libCat}` : ''}`); } catch { return; }
  const C = $('libCats'); C.innerHTML = '';
  [null, ...r.categories].forEach(c => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = c || 'all';
    b.setAttribute('aria-pressed', libCat === c); b.onclick = () => { libCat = c; browse(); }; C.appendChild(b); });
  const I = $('libItems'); I.innerHTML = '';
  const locked = P.locks.includes(sel.material.key);
  r.items.forEach(it => { const b = swatch(it.name, it.color, sel.material.current === it.id, () => useMaterial(it.id, it.name), it.source !== 'Built-in' ? 'scan' : '');
    b.disabled = locked; b.title = `${it.category} · ${it.source}${it.license ? ' · ' + it.license : ''}`; I.appendChild(b); });
  if (!r.items.length) I.textContent = 'No materials match.';
}
function watch() {
  clearInterval(poll);
  poll = setInterval(async () => {
    try { P = await api(`/api/projects/${P.id}`); } catch { return; }
    show(P);
    if (P.status !== 'rendering') clearInterval(poll);
  }, 1500);
}
function show(p) {
  steps(p.status === 'rendering' ? ['render'] : sel ? ['refine'] : ['moment', 'refine']);
  if (p.image && $('render').getAttribute('src') !== p.image) { $('render').src = p.image; if (sel) $('overlay').src = maskUrl(); }
  const busy = $('busy');
  busy.hidden = p.status !== 'rendering' && p.status !== 'error';
  busy.textContent = p.status === 'error' ? `Render failed: ${p.error}` : p.pending > 1 ? `Rendering · ${p.pending} passes to go` : 'Rendering…';
  const M = $('moments'); M.innerHTML = '';
  cat.moments.forEach(m => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = m; b.setAttribute('aria-pressed', p.state.moment === m); b.onclick = () => layer('moment', `Moment: ${m}`, {moment: m}); M.appendChild(b); });
  const K = $('kelvins'); K.innerHTML = '';
  [2700, 3000, 4000].forEach(k => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = `${k} K`; b.setAttribute('aria-pressed', p.state.kelvin === k); b.onclick = () => layer('kelvin', `Lights: ${k} K`, {kelvin: k}); K.appendChild(b); });
  $('tPendant').setAttribute('aria-pressed', p.state.pendant); $('tCove').setAttribute('aria-pressed', p.state.cove);
  $('tAI').setAttribute('aria-pressed', !!(p.ai && p.ai.on)); $('tAI').disabled = !(p.ai && p.ai.available);
  $('aiHint').textContent = !(p.ai && p.ai.available) ? 'Not set up yet: the server needs a FAL_KEY.'
    : p.ai.last && !p.ai.last.accepted ? `AI result rejected: edges moved (match ${(p.ai.last.edge_agreement * 100).toFixed(0)}%). Showing the render instead.`
    : p.ai.last ? `Geometry check passed (${(p.ai.last.edge_agreement * 100).toFixed(0)}% of edges unchanged).` : 'Adds real texture and softness. Geometry is locked to your model.';
  const L = $('layers'); L.innerHTML = '';
  const base = document.createElement('label'); base.textContent = p.model ? `Base: ${p.model}` : 'Base: sample room'; base.style.color = 'var(--muted)'; L.appendChild(base);
  p.layers.forEach(l => {
    const lab = document.createElement('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = l.on; cb.id = 'l' + l.id;
    cb.onchange = async () => { try { P = await api(`/api/projects/${p.id}/layers/${l.id}`, json('PATCH', {on: cb.checked})); show(P); watch(); } catch (err) { cb.checked = !cb.checked; toast(err.message); } };
    lab.append(cb, document.createTextNode(l.label)); L.appendChild(lab);
  });
  const G = $('mats'); G.innerHTML = ''; $('matGroup').hidden = !(p.materials && p.materials.length);
  (p.materials || []).forEach(m => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mat';
    b.setAttribute('aria-pressed', !!(sel && sel.material && sel.material.slot === m.slot));
    const i = document.createElement('i'); i.style.background = m.color || '#888';
    const n = document.createElement('span'); n.textContent = m.slot; n.title = m.slot;
    const c = document.createElement('small'); c.textContent = (m.auto && m.current ? 'auto · ' : '') + m.current_name;
    b.append(i, n, c);
    b.onclick = async () => { try { select(await api(`/api/projects/${p.id}/material?slot=${encodeURIComponent(m.slot)}`)); } catch (err) { toast(err.message); } };
    G.appendChild(b);
  });
  $('trust').textContent = p.layers.some(l => l.on) && p.status === 'ready' && p.outside_identical ? 'Checked: every pixel outside your edits matches the base render.' : '';
  panel();
}
function panel() {
  const nm = $('selName'), hint = $('selHint'), sw = $('swatches'), lr = $('lockRow');
  sw.innerHTML = ''; $('lib').hidden = !(sel && sel.material);
  if (!sel) { nm.textContent = 'Nothing selected'; hint.textContent = 'Tap an object in the picture.'; lr.hidden = true; return; }
  if (sel.material) {
    const m = sel.material, locked = P.locks.includes(m.key);
    nm.textContent = sel.object ? `${sel.name} · ${m.slot}` : m.slot;
    lr.hidden = false; $('tLock').setAttribute('aria-pressed', locked);
    hint.textContent = locked ? 'Locked. Edits cannot touch this material.'
      : `Now: ${m.current_name}${m.auto && m.auto === m.current ? ' (matched automatically)' : ''}. Pick a material: every surface with it changes, nothing else does.`;
    m.suggestions.forEach(s => { const b = swatch(s.name, s.color, m.current === s.value, () => useMaterial(s.value, s.name)); b.disabled = locked; sw.appendChild(b); });
    return;
  }
  nm.textContent = sel.name;
  const locked = P.locks.includes(sel.object);
  if (!sel.editable) { hint.textContent = 'This comes straight from your model. Finishes for it are coming in a later version.'; lr.hidden = true; return; }
  lr.hidden = false; $('tLock').setAttribute('aria-pressed', locked);
  hint.textContent = locked ? 'Locked. Edits cannot touch it.' : 'Pick a finish. Only this object will change.';
  Object.entries(sel.finishes).forEach(([n, h]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sw';
    const i = document.createElement('i'); i.style.background = h; b.append(i, document.createTextNode(n));
    b.setAttribute('aria-pressed', P.state[sel.object] === n); b.disabled = locked;
    b.onclick = () => layer(`${sel.object}:finish`, `${sel.name}: ${n}`, {[sel.object]: n});
    sw.appendChild(b);
  });
}
})();
</script>
</body>
</html>
